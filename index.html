};

function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0; }
function round2(n) { return Math.round(n * 100) / 100; }

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return { r: parseInt(h.substring(0, 2), 16), g: parseInt(h.substring(2, 4), 16), b: parseInt(h.substring(4, 6), 16) };
}
function lerpColor(a, b, t) {
  const pa = hexToRgb(a), pb = hexToRgb(b);
  return `rgb(${Math.round(pa.r + (pb.r - pa.r) * t)},${Math.round(pa.g + (pb.g - pa.g) * t)},${Math.round(pa.b + (pb.b - pa.b) * t)})`;
}
function scaleYellow(v) { return lerpColor('#FAFAF9', COLOR.yellow, Math.max(0, Math.min(1, (v - 1) / 4))); }
function scaleOrange(v) { return lerpColor('#FAFAF9', COLOR.orange, Math.max(0, Math.min(1, (v - 1) / 4))); }

function HBarChart({ items, max = 5, color = COLOR.orange, refLine, refLineLabel, rowHeight, labelWidth = 190, formatValue, getTooltip }) {

/* ============ Mini histogram (distribution beside a stat number) ============ */
function MiniHistogram({ values, width = 90, height = 44 }) {
  const bins = [1, 2, 3, 4, 5].map(score => values.filter(v => Math.round(v) === score).length);
  const total = values.length || 1;
  const gap = 3;
  const barW = (width - gap * 4) / 5;
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
      {bins.map((count, i) => {
        const h = Math.max(2, (count / total) * height);
        const x = i * (barW + gap);
        const y = height - h;
        return <rect key={i} x={x} y={y} width={barW} height={h} fill={SCORE_COLORS[i]} rx={2} />;
      })}
    </svg>
  );
}

/* ============ Distribution row: 100%-stacked score bar + mean marker ============ */
function DistributionRow({ label, values, labelWidth = 190, warnDirection = 'low', warnLabel = 'คะแนนต่ำ', tooltip }) {
  const total = values.length || 1;
  const counts = [1, 2, 3, 4, 5].map(s => values.filter(v => v === s).length);
  const pcts = counts.map(c => (c / total) * 100);
  let cum = 0;
  const segments = pcts.map((p, i) => { const seg = { start: cum, width: p, color: SCORE_COLORS[i] }; cum += p; return seg; });
  const meanValue = round2(mean(values));
  const meanPct = ((meanValue - 1) / 4) * 100;
  const warnPct = warnDirection === 'high'
    ? Math.round(((counts[3] + counts[4]) / total) * 100)
    : Math.round(((counts[0] + counts[1]) / total) * 100);

  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16, marginTop: 14 }}>
      <div style={{ width: labelWidth, fontSize: 12.5, color: COLOR.dark, flexShrink: 0, cursor: tooltip ? 'help' : 'default' }} title={tooltip}>
        {label}{tooltip && <span style={{ color: COLOR.blueGrey }}> ⓘ</span>}
      </div>
      <div style={{ flex: 1, position: 'relative' }}>
        <svg width="100%" height="24" viewBox="0 0 100 24" preserveAspectRatio="none" style={{ display: 'block', borderRadius: 4, overflow: 'hidden' }}>
          {segments.map((s, i) => <rect key={i} x={s.start} y={0} width={s.width} height={24} fill={s.color} />)}
        </svg>
        <div style={{ position: 'absolute', left: `${meanPct}%`, top: -15, transform: 'translateX(-50%)', textAlign: 'center', width: 40 }}>
          <div style={{ fontSize: 10.5, color: COLOR.meanDot, fontWeight: 700, whiteSpace: 'nowrap' }}>{meanValue}</div>
          <div style={{ width: 9, height: 9, borderRadius: '50%', background: COLOR.meanDot, margin: '2px auto 0', boxShadow: `0 0 0 2px ${COLOR.bg}` }} />
        </div>
      </div>
      <div style={{ width: 108, fontSize: 12, color: warnPct > 15 ? COLOR.orange : COLOR.blueGrey, textAlign: 'right', flexShrink: 0, fontWeight: warnPct > 15 ? 700 : 400 }}>
        {warnPct}% {warnLabel}
      </div>
    </div>
  );
}

/* ============ Custom SVG pie chart (percent-based) ============ */
function polarToCartesian(cx, cy, r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function arcPath(cx, cy, r, startAngle, endAngle) {
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArc = endAngle - startAngle <= 180 ? '0' : '1';
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y} Z`;
}
function PieChartSVG({ dataMap, shortenLabels }) {
  const entries = Object.entries(dataMap);
  const total = entries.reduce((s, [, v]) => s + v, 0);
  let angle = 0;
  const size = 200, r = 85, cx = size / 2, cy = size / 2;
  const slices = entries.map(([name, value], i) => {
    const pct = total ? (value / total) * 100 : 0;
    const start = angle;
    const end = angle + (pct / 100) * 360;
    angle = end;
    return { name: shortenLabels ? (GROUP_SHORT[name] || name) : name, fullName: name, value, pct, path: arcPath(cx, cy, r, start, end), color: PIE_COLORS[i % PIE_COLORS.length] };
  });
  return (
    <div style={{ display: 'flex', gap: 24, alignItems: 'center', flexWrap: 'wrap' }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        {slices.map((s, i) => (
          <path key={i} d={s.path} fill={s.color} stroke={COLOR.bg} strokeWidth={2}>
            <title>{`${s.fullName}: ${Math.round(s.pct)}% (${s.value} คน)`}</title>
          </path>
        ))}
      </svg>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {slices.map((s, i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13.5 }} title={s.fullName}>
            <span style={{ width: 11, height: 11, borderRadius: 3, background: s.color, display: 'inline-block' }} />
            <span style={{ color: COLOR.dark }}>{s.name}</span>
            <span style={{ color: COLOR.blueGrey }}>{Math.round(s.pct)}% ({s.value})</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============ Page 4: AI usage & attitude (redesigned) ============ */
function toolCount(r) {
  if (!r.everUsedAI) return 0;
  return String(r.aiToolsUsed).split(',').map(s => s.trim()).filter(Boolean).length;
}
function countList(list) {
  const m = {};
  list.forEach(items => items.forEach(t => { m[t] = (m[t] || 0) + 1; }));
  return m;
}

/* ============ Pages 6 & 7: qualitative theme explorer (no identifying info) ============ */
function ThemeExplorer({ data, questions }) {
  const [qIdx, setQIdx] = useState(0);
  const [theme, setTheme] = useState(null);
  const [search, setSearch] = useState('');
  const q = questions[qIdx];

  const counts = {};
  data.forEach(r => (r[q.themeField] || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
  const sortedThemes = q.themeList.map(t => [t, counts[t] || 0]).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]);

  const matches = data.filter(r => {
    const text = r[q.textField] || '';
    const themeOk = !theme || (r[q.themeField] || []).includes(theme);
    const searchOk = !search || text.toLowerCase().includes(search.toLowerCase());
    return themeOk && searchOk && text;
  });

  return (
    <div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 18, flexWrap: 'wrap' }}>
        {questions.map((qq, i) => (
          <button key={qq.key} onClick={() => { setQIdx(i); setTheme(null); }}
            style={{ padding: '9px 16px', borderRadius: 20, border: `1px solid ${i === qIdx ? COLOR.orange : COLOR.border}`, background: i === qIdx ? COLOR.orange : COLOR.bg, color: i === qIdx ? '#fff' : COLOR.dark, fontFamily: FONT, fontSize: 13.5, cursor: 'pointer', fontWeight: i === qIdx ? 700 : 400 }}>
            {qq.label}
          </button>
        ))}
      </div>

      <Card title="ธีมที่พบบ่อย" note="คลิกธีมเพื่อกรองคำตอบด้านล่าง (นับจากจำนวนคนที่พูดถึง ไม่ใช่ % ของคำตอบทั้งหมด)">
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
          {sortedThemes.map(([t, n]) => (
            <button key={t} onClick={() => setTheme(theme === t ? null : t)}
              style={{ padding: '7px 13px', borderRadius: 16, cursor: 'pointer', fontFamily: FONT, fontSize: 12.5, border: `1px solid ${theme === t ? COLOR.orange : COLOR.border}`, background: theme === t ? COLOR.orangeSoft : COLOR.bgSoft, color: COLOR.dark }}>
              {t} <span style={{ color: COLOR.blueGrey }}>({n})</span>
            </button>
          ))}
          {sortedThemes.length === 0 && <EmptyState text="ไม่มีธีมที่พบในข้อมูลที่กรองไว้" />}
        </div>
      </Card>

      <Card title={`คำตอบจริง (${matches.length} รายการ)`}>
        <input placeholder="ค้นหาคำในคำตอบ..." value={search} onChange={e => setSearch(e.target.value)}
          style={{ width: '100%', padding: '9px 12px', borderRadius: 8, border: `1px solid ${COLOR.border}`, fontFamily: FONT, fontSize: 13.5, marginBottom: 14, boxSizing: 'border-box', background: COLOR.bgSoft }} />
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, maxHeight: 480, overflowY: 'auto' }}>
          {matches.map((r, i) => (
            <div key={i} style={{ padding: '12px 14px', border: `1px solid ${COLOR.border}`, borderRadius: 8 }}>
              <div style={{ fontSize: 13.5, color: COLOR.dark, marginBottom: 6, whiteSpace: 'pre-wrap' }}>{r[q.textField]}</div>
              <div style={{ fontSize: 11.5, color: COLOR.blueGrey }}>{GROUP_SHORT[r.group] || r.group} · {r.position}</div>
            </div>
          ))}
          {matches.length === 0 && <EmptyState />}
        </div>
      </Card>
    </div>
  );
}
function PagePainPoints({ data }) {
  const questions = [
    { key: 'rep', label: 'งานทำซ้ำ / ใช้เวลานาน', textField: 'painRepetitive', themeField: 'painRepetitiveThemes', themeList: PAIN_THEMES },
    { key: 'err', label: 'งานผิดพลาดบ่อย / เสี่ยง', textField: 'painError', themeField: 'painErrorThemes', themeList: PAIN_THEMES },
    { key: 'ai', label: 'งานที่อยากให้ AI ช่วย', textField: 'painAI', themeField: 'painAIThemes', themeList: PAIN_THEMES },
  ];
  return <ThemeExplorer data={data} questions={questions} />;
}
function PageTraining({ data }) {
  const questions = [
    { key: 'exp', label: 'ความคาดหวังจากการอบรม', textField: 'trainExpect', themeField: 'trainExpectThemes', themeList: EXP_THEMES },
    { key: 'con', label: 'ข้อกังวลเรื่องการอบรม', textField: 'trainConcern', themeField: 'trainConcernThemes', themeList: CONCERN_THEMES },
  ];
  return <ThemeExplorer data={data} questions={questions} />;
}

/* ============ App shell ============ */
const TABS = [
  { key: 'overview', label: 'ภาพรวม' },
  { key: 'demo', label: 'ข้อมูลผู้ตอบ' },
  { key: 'digital', label: 'ทักษะดิจิทัล' },
  { key: 'ai', label: 'การใช้ AI/ทัศนคติ' },
  { key: 'heatmap', label: 'เทียบกลุ่ม→AI' },
  { key: 'pain', label: 'Pain Points' },
  { key: 'training', label: 'การอบรม' },
];

function Dashboard() {
  const [tab, setTab] = useState('overview');
  const [filters, setFilters] = useState({ group: 'ทั้งหมด', position: 'ทั้งหมด', tenure: 'ทั้งหมด', cluster: 'ทั้งหมด' });
  const filtered = useMemo(() => applyFilters(R, filters), [filters]);

  return (
    <div style={{ fontFamily: FONT, background: COLOR.bg, minHeight: '100vh', color: COLOR.dark }}>
      <div style={{ padding: '20px 22px 0 22px' }}>
        <div style={{ fontSize: 19, fontWeight: 700, marginBottom: 2 }}>AI Readiness Dashboard</div>
        <div style={{ fontSize: 12.5, color: COLOR.blueGrey, marginBottom: 16 }}>สำนักงานคลัง มจธ. — ผลสำรวจ Phase 1 (n=40)</div>
        <div style={{ display: 'flex', gap: 4, borderBottom: `1px solid ${COLOR.border}`, flexWrap: 'wrap' }}>
          {TABS.map(t => (
            <button key={t.key} onClick={() => setTab(t.key)}
              style={{ padding: '10px 16px', border: 'none', background: 'transparent', cursor: 'pointer', fontFamily: FONT, fontSize: 13.5, color: tab === t.key ? COLOR.orange : COLOR.blueGrey, fontWeight: tab === t.key ? 700 : 400, borderBottom: tab === t.key ? `2px solid ${COLOR.orange}` : '2px solid transparent', marginBottom: -1 }}>
              {t.label}
            </button>
          ))}
        </div>
      </div>
      <FilterBar filters={filters} setFilters={setFilters} />
      <div style={{ padding: '22px', maxWidth: 1100, margin: '0 auto' }}>
        {tab === 'overview' && <PageOverview data={filtered} />}
        {tab === 'demo' && <PageDemographics data={filtered} />}
        {tab === 'digital' && <PageDigital data={filtered} />}
        {tab === 'ai' && <PageAIAttitude data={filtered} />}
        {tab === 'heatmap' && <PageHeatmap data={filtered} />}
        {tab === 'pain' && <PagePainPoints data={filtered} />}
        {tab === 'training' && <PageTraining data={filtered} />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Dashboard />);

</script>
</body>
</html>
